<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="styles.css" /> 
    <title>Create Post</title>
</head>
<body>
    <header>
        <h1>Create a Post</h1>
    </header>
    <nav>
        <a href="login.html">Login</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="archive.html">Search Archive</a>
        <a href="admin.html">Admin</a>
    </nav>
    <div class="container">
        <form>
            <div class="form-group">
                <label for="title">Post Title</label>
                <input type="text" id="title" name="title" placeholder="Enter post title">
            </div>
            <div class="form-group">
                <label for="description">Post Description</label>
                <textarea id="description" name="description" placeholder="Enter post description" rows="5"></textarea>
            </div>
            <div class="form-group">
                <label for="priority">Priority</label>
                <select id="priority" name="priority">
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>
            </div>
            <div>
                <button class="btn" type="submit">Create Post</button>
            </div>
        </form>
    </div>
    <a href="index.html">Back to Home</a>
</body>
</html>
